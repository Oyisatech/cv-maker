<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OyisaTech R49</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f1f5f9;padding:12px}.c{max-width:600px;margin:auto;background:#fff;border-radius:12px;padding:18px}label{font-weight:bold;margin-top:10px;display:block;font-size:13px}input,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px}.b{width:100%;padding:13px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}.g{background:#10b981;color:#fff}.grey{background:#94a3b8;color:#fff}.pay{background:#fef3c7;border:2px solid #f59e0b;padding:12px;border-radius:10px;margin-top:12px;text-align:center}</style></head><body><div class="c"><h2 style="text-align:center">OyisaTech CV Maker</h2><p style="text-align:center;color:#64748b;font-size:13px">Pro CV in 2 Mins - R49 🇿🇦 | Capitec Pay 0634800609</p>
<label>Full Name</label><input id="name"><label>Job Title</label><input id="title"><label>Phone (Important! Code is last 4 digits)</label><input id="phone" type="tel" placeholder="071..."><label>Email</label><input id="email"><label>Profile</label><textarea id="profile"></textarea><label>Experience</label><textarea id="exp"></textarea><label>Education</label><textarea id="edu"></textarea><label>Skills</label><input id="skills">
<button class="b g" onclick="gen()">Generate Preview</button><div id="prev" style="display:none;margin-top:15px;border:1px dashed #ccc;padding:12px"><h3 id="pN"></h3><p id="pT" style="color:#10b981;font-weight:bold"></p><p id="pC" style="font-size:11px"></p><hr><p style="font-size:13px"><b>Profile:</b> <span id="pP"></span><br><b>Exp:</b> <span id="pE"></span><br><b>Edu:</b> <span id="pD"></span><br><b>Skills:</b> <span id="pS"></span></p>
<div class="pay"><h3>🔒 Pay R49 to Unlock</h3><p style="font-size:13px"><b>Capitec Pay: 063 480 0609</b></p><p style="font-size:11px">1.Pay R49 2.WhatsApp POP to 0634800609<br>3.We send you YOUR unique code</p>
<div style="display:flex;gap:6px;margin-top:8px"><input id="code" placeholder="Enter last 4 digits" style="flex:1"><button onclick="check()" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:11px 16px;font-weight:bold">Unlock</button></div><p id="msg" style="font-size:12px;margin-top:6px"></p>
<button id="dl" disabled class="b grey">🔒 Enter Code to Download</button></div></div></div>
<script>function gen(){let n=document.getElementById('name').value;let t=document.getElementById('title').value;let ph=document.getElementById('phone').value;let em=document.getElementById('email').value;if(!ph||ph.length<10){alert('Enter valid phone! We use last 4 digits as your code');return;}document.getElementById('pN').innerText=n;document.getElementById('pT').innerText=t;document.getElementById('pC').innerText=ph+' | '+em;document.getElementById('pP').innerText=document.getElementById('profile').value;document.getElementById('pE').innerText=document.getElementById('exp').value;document.getElementById('pD').innerText=document.getElementById('edu').value;document.getElementById('pS').innerText=document.getElementById('skills').value;document.getElementById('prev').style.display='block';document.getElementById('msg').innerText='Your code is last 4 digits of: '+ph.slice(-4);document.getElementById('msg').style.color='#16a34a';}
function check(){let ph=document.getElementById('phone').value.trim();let last4=ph.slice(-4);let c=document.getElementById('code').value.trim();let m=document.getElementById('msg');let b=document.getElementById('dl');if(c===last4 && last4.length===4){m.style.color='green';m.innerText='✅ Correct! '+last4+' unlocked. Download now';b.disabled=false;b.className='b g';b.innerText='✅ Download Your CV Now';b.onclick=down;}else{m.style.color='red';m.innerText='❌ Wrong! Your code is last 4 digits of '+ph+' = '+last4+' - Pay first, then use that code';}}
function down(){let txt=`OYISATECH CV - R49 PAID\nName:${document.getElementById('name').value}\nTitle:${document.getElementById('title').value}\nPhone:${document.getElementById('phone').value}\nEmail:${document.getElementById('email').value}\nPROFILE:${document.getElementById('profile').value}\nEXP:${document.getElementById('exp').value}\nEDU:${document.getElementById('edu').value}\nSKILLS:${document.getElementById('skills').value}`;let bl=new Blob([txt],{type:'text/plain'});let u=URL.createObjectURL(bl);let a=document.createElement('a');a.href=u;a.download=document.getElementById('name').value.replace(/\s+/g,'_')+'_CV.txt';a.click();}</script></body></html>
