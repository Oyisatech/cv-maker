<button id="downloadBtn" disabled style="background:grey">🔒 Pay R49 to Download</button>

<div style="margin-top:10px">
<input id="unlockCode" placeholder="Enter code after payment" style="padding:10px;width:60%">
<button onclick="checkCode()" style="padding:10px;background:green;color:white">Unlock</button>
<p style="font-size:12px">After Capitec Pay 063 480 0609, WhatsApp POP to get code</p>
</div>

<script>
function checkCode(){
  let code = document.getElementById('unlockCode').value;
  if(code === "OYISA49"){
    document.getElementById('downloadBtn').disabled = false;
    document.getElementById('downloadBtn').style.background = "#10b981";
    document.getElementById('downloadBtn').innerHTML = "✅ Download Your CV Now";
    alert("Code correct! You can download now");
  } else {
    alert("Wrong code! WhatsApp 0634800609 with POP to get correct code");
  }
}
</script>
